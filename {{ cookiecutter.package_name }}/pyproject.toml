[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.package_name }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
{% if cookiecutter.license == "MIT" %}license = "MIT"
{% elif cookiecutter.license == "Apache-2.0" %}license = "Apache-2.0"
{% elif cookiecutter.license == "BSD-3-Clause" %}license = "BSD-3-Clause"
{% else %}license = "CC0-1.0"
{% endif %}authors = [
    { name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.email }}" },
]
requires-python = ">={{ cookiecutter.python_version }}"
classifiers = [
    "Programming Language :: Python",
{% for v in ["3.10", "3.11", "3.12", "3.13", "3.14"] %}    "Programming Language :: Python :: {{ v }}",
{% endfor %}]
{% if cookiecutter.docs == "yes" %}
[project.optional-dependencies]
docs = ["mkdocs-material"]

{% endif %}
[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov={{ cookiecutter.package_name }}", "--cov-report=term-missing"]
