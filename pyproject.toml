[project]
name = "cookiepystarter-dev"
version = "0.0.0"
description = "Dev tooling for the CookiePyStarter template repo (not published)."
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "cookiecutter>=2.2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
